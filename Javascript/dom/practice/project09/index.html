<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>画圆</title>
    <style>
      canvas {
        border: 1px solid #333;
        display: block;
        margin: 20px 0;
      }
      button {
        margin-right: 10px;
      }
    </style>
  </head>
  <body>
    <h2>拖动画圆</h2>
    <button id="clear">清空画布</button>
    <canvas id="canvas" width="500" height="400"></canvas>

    <script>
      const canvas = document.getElementById('canvas');
      const btn = document.getElementById('clear');
      const ctx = canvas.getContext('2d');

      let paint = false;
      let a = { x: undefined, y: undefined };

      canvas.onmousedown = (e) => {
        let x = e.offsetX;
        let y = e.offsetY;
        a = { x: x, y: y };
        paint = true;
      };

      canvas.onmousemove = (e) => {
        let x = e.offsetX;
        let y = e.offsetY;
        let newPoint = { x: x, y: y };
        if (paint) {
          ctx.beginPath();
          ctx.arc(a.x, a.y, newPoint.x - a.x, 0, Math.PI * 2);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = 'green';
          ctx.stroke();
        }
      };

      canvas.onmouseup = (e) => {
        paint = false;
      };

      btn.addEventListener('click', () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      });
    </script>
  </body>
</html>
