<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
      }
      canvas {
        background-color: white;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
  </body>
  <script>
    // 1.拿到canvas上下文
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // 2.初始化全局画布
    function initCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    initCanvas();
    // 适应窗口大小
    window.addEventListener('resize', initCanvas);

    // 设置存放小球的容器
    let allBalls = [];
    // 设置颜色集
    const colors = ['#4CBF88', '#F2B134', '#6F4A70', '#FF6275', '#00B5C4'];

    // 3.定义小球
    function defineBalls() {
      const r = 5;
      const x = Math.random() * (canvas.width - 2 * r) + r;
      const y = Math.random() * (canvas.height - 2 * r) + r;
      const dx = (Math.random() - 0.5) * 2;
      const dy = (Math.random() - 0.5) * 2;
      const color = colors[Math.floor(Math.random() * colors.length)];

      return { x, y, r, dx, dy, color };
    }

    // 4.创建小球
    function createBalls() {
      allBalls = [];
      for (let i = 0; i < 200; i++) {
        allBalls.push(defineBalls());
      }
    }

    // 5.绘制小球函数
    function drawBall(ball) {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = ball.color;
      ctx.fill();
      console.log(123);
    }

    // 6.更新小球位置 & 边界条件判断
    function updateBalls(ball) {
      ball.x += ball.dx;
      ball.y += ball.dy;

      if (ball.x + ball.r > canvas.width || ball.x - ball.r < 0) {
        ball.dx = -ball.dx;
      }
      if (ball.y + ball.r > canvas.height || ball.y - ball.r < 0) {
        ball.dy = -ball.dy;
      }

      console.log(123);
    }

    // 循环小球的动画
    function move() {
      requestAnimationFrame(move);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      console.log(allBalls);
      for (let b of allBalls) {
        drawBall(b);
        updateBalls(b);
      }
    }

    createBalls();
    move();
  </script>
</html>
